name: Build Windows GUI EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build xver-main.exe
        shell: pwsh
        run: .\build-xver-gui.ps1

      - name: Collect EXE
        shell: pwsh
        run: Copy-Item "$env:USERPROFILE\xver-gui-build\dist\xver-main.exe" "$env:GITHUB_WORKSPACE\xver-main.exe" -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: xver-main-windows
          path: xver-main.exe
          if-no-files-found: error
