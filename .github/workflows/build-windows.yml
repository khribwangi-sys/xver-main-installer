name: Build Windows GUI EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build xver-main.exe
        shell: pwsh
        run: .\build-xver-gui.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: xver-main-windows
          path: ${{ env.USERPROFILE }}\Desktop\xver-main.exe
          if-no-files-found: error
